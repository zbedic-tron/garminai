services:
  - type: web
    name: garminai-public-demo
    runtime: python
    plan: free
    rootDir: public
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn garminai_public.http_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # For EXISTING Blueprints, configure manually in Render Dashboard.
      # Do not commit the token or its SHA-256 digest to GitHub.
